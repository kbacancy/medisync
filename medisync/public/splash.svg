<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932">
  <!-- Background -->
  <rect width="430" height="932" fill="#0f172a"/>

  <!-- Centred icon group -->
  <g transform="translate(215, 466)">
    <!-- Icon card -->
    <rect x="-56" y="-56" width="112" height="112" rx="24" fill="#1e293b"/>

    <!-- Pill -->
    <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#ffffff"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M-30 0 Q-30 -10 -20 -10 H0 V10 H-20 Q-30 10 -30 0Z" fill="#38bdf8" opacity="0.85"/>

    <!-- ECG line above pill -->
    <polyline
      points="-38,-24 -28,-24 -22,-36 -16,-14 -10,-28 -4,-24 0,-24 4,-24 10,-36 16,-14 22,-28 28,-24 38,-24"
      fill="none" stroke="#38bdf8" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- App name -->
  <text
    x="215" y="556"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28" font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-0.5"
  >MediSync</text>

  <!-- Tagline -->
  <text
    x="215" y="590"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="14" font-weight="400"
    fill="#64748b"
    text-anchor="middle"
  >Clinical Medication Tracking</text>
</svg>
